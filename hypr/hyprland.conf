# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

################
### MONITORS ###
################

monitor=eDP-1,preferred,auto,auto

###################
### MY PROGRAMS ###
###################

$terminal = gnome-terminal
$fileManager = nautilus
$menu = wofi --show drun
$browser = flatpak run com.brave.Browser

#################
### AUTOSTART ###
#################


exec-once = hyprctl setcursor macOS 24
exec-once = hyprpaper & waybar & mako &

# this for notification of Battery Low
exec-once = bash -c 'last_notified=0; while true; do BATTERY=$(cat /sys/class/power_supply/BAT0/capacity); STATUS=$(cat /sys/class/power_supply/BAT0/status); if [ "$STATUS" = "Discharging" ]; then if [ "$BATTERY" -le 10 ] && [ "$last_notified" -ne 10 ]; then notify-send "Critically Low Battery" "Battery at ${BATTERY}%"; last_notified=10; elif [ "$BATTERY" -le 20 ] && [ "$last_notified" -ne 20 ] && [ "$BATTERY" -gt 10 ]; then notify-send "Low Battery" "Battery at ${BATTERY}%"; last_notified=20; fi; else last_notified=0; fi; sleep 300; done &'

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24



#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 8
    border_size = 0
    
    # Beautiful blue gradient borders
    col.active_border = rgba(6495edcc) rgba(4776ffcc) 90deg
    col.inactive_border = rgba(6969694d)
    
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# Enhanced decoration with perfect blur
decoration {
    rounding = 8
    
    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        ignore_opacity = false
        vibrancy = 0.25
    }
    
    active_opacity = 0.93
    inactive_opacity = 0.86
    
    shadow {
        enabled = true
        range = 7
        render_power = 3
        color = rgba(0,0,0,0.5)
    }
}

# Smooth and fluid animations
animations {
    enabled = yes

    # Enhanced bezier curves for smoother animations
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 0.46, 0.45, 0.94
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = bounce, 0.68, -0.6, 0.32, 1.6
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = slow, 0, 0.85, 0.3, 1
    bezier = emphasis, 0.42, 0, 0.58, 1
    bezier = photoSwipe, 0.25, 0.1, 0.25, 1
    bezier = softOpen, 0.34, 1.56, 0.64, 1
    bezier = gentleIn, 0.23, 1, 0.32, 1
    bezier = gentleOut, 0.4, 0, 0.6, 1

    # Core animations with improved timing and curves
    animation = global, 1, 6, wind
    animation = border, 1, 10, wind

    # Window animations - gentle and smooth
    animation = windows, 1, 4, gentleIn, slide
    animation = windowsIn, 1, 5, gentleIn, popin 90%
    animation = windowsOut, 1, 3, gentleOut, popin 90%
    animation = windowsMove, 1, 4, wind, slide

    # Fade animations - quicker and more responsive
    animation = fadeIn, 1, 8, wind
    animation = fadeOut, 1, 4, winOut
    animation = fade, 1, 6, overshot
    animation = fadeDim, 1, 8, smoothOut
    animation = fadeSwitch, 1, 4, wind
    animation = fadeShadow, 1, 8, wind

    # Layer animations - smoother transitions
    animation = layers, 1, 6, wind
    animation = layersIn, 1, 6, winIn, fade
    animation = layersOut, 1, 4, winOut, fade

    # Workspace animations - smooth like photo swiping
    animation = workspaces, 1, 4, photoSwipe, slide
    animation = workspacesIn, 1, 4, photoSwipe, slide
    animation = workspacesOut, 1, 3, photoSwipe, slide

    # Specialized animations for better UX
    animation = specialWorkspace, 1, 4, wind, slidevert
    animation = borderangle, 1, 8, liner, loop
}
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true
    preserve_split = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = on
    }
}

gestures {
    workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, D, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# this is for screenshot
# this take part of screen and save it only
bind = SHIFT, Print, exec, hyprshot -m region -o /home/moaad/Pictures/Screenshots -f "shot_$(date +'%s').png"
# this take all the screen and save it 
bind = , Print, exec, hyprshot -m output -o /home/moaad/Pictures/Screenshots -f "shot_$(date +'%s').png"


# Move focus with mainMod + arrow keys
bind = $mainMod, J, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, I, movefocus, u
bind = $mainMod, K, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Wofi opacity
windowrulev2 = opacity 0.95 override, class:^(wofi)$

# Kitty opacity + blur combined in one rule
windowrulev2 = opacity 0.92 override, blur, class:^(gnome-terminal)$

# Change Spotify opacity to be different from global:
windowrulev2 = opacity 0.85 override, blur, class:^(Spotify)$
