$accent = $mauve
$accentAlpha = $mauveAlpha
$font = SF Pro Display  # Use SF Pro Display for authentic macOS look, fallback to system font

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
}

# BACKGROUND - More aggressive blur like macOS
background {
    monitor = eDP-1
    path = /home/moaad/Pictures/wall.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    color = rgba(0, 0, 0, 0.5)  # Subtle dark overlay
}

# TIME - Large, bold, centered like macOS
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"  # 12-hour format without leading zero
    color = rgba(255, 255, 255, 0.9)
    font_size = 135
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}


# DATE - Below time, macOS style
label {
    monitor = eDP-1
    text = cmd[update:60000] echo "$(date +"%A, %B %-d")"  # "Monday, January 1" format
    color = rgba(255, 255, 255, 0.8)
    font_size = 32
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# INPUT FIELD - macOS style with rounded corners and subtle styling
input-field {
    monitor = eDP-1
    size = 350, 50
    outline_thickness = 0
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = 7
    rounding = 10  # Rounded like macOS input fields
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    fade_timeout = 2000
    placeholder_text = <span foreground="##ffffff60"><i>ENTER PASS A BOGOUSS</i></span>
    hide_input = false
    check_color = rgba(34, 197, 94, 1.0)  # Green checkmark
    fail_color = rgba(239, 68, 68, 1.0)   # Red for failed attempts
    fail_text = <span foreground="##ef4444"><i>IWA LAAA</i></span>
    capslock_color = rgba(245, 158, 11, 1.0)  # Amber for caps lock
    position = 0, -200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.3)
}
