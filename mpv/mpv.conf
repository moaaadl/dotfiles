# ~/.config/mpv/mpv.conf

# Netflix-style subtitle configuration
sub-font='SF Pro Display'
sub-font-size=42
sub-color='#FFFFFF'
sub-border-color='#000000'
sub-border-size=1.0
sub-shadow-offset=1.0
sub-shadow-color='#000000'
sub-margin-y=60
sub-back-color='#00000000'
sub-blur=0
sub-bold=no
sub-italic=no
sub-spacing=0.5
sub-justify=center
sub-ass-override=force
sub-scale=1.0

# Additional Netflix-like enhancements
osd-font='SF Pro Display'
osd-font-size=32
osd-color='#FFFFFF'
osd-border-color='#000000'
osd-border-size=1.5
